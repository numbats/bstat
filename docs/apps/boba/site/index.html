<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny App</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
<script>let bobaTab="sample",bobaMode="full";window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data?.bobaTab)bobaTab=e.data.bobaTab;if(e.data?.bobaMode)bobaMode=e.data.bobaMode;if(e.data?.bobaTab||e.data?.bobaMode||e.data?.bobaReady){document.querySelector("iframe")?.contentWindow.postMessage({bobaTab,bobaMode},location.origin);}});</script>
