SOURCE: Seminar Week 10 ETF1100 S1 2026.pdf, page 7.
EDITABLE TEXT TRANSCRIPTION:
What is optimisation?
Process of finding the best decisions for a particular measure of
performance

In defining “best decision” and “performance”, we need to have:
• Known input parameters
• A set of decisions – things that the business can control
• Some constraints on the decision
• An objective or criteria to reach

                These can be formulated to a model.
-->
</section>

<!--
SOURCE: Seminar Week 10 ETF1100 S1 2026.pdf, page 8.
EDITABLE TEXT TRANSCRIPTION:
Example:
A business firm wants to determine a selling price for Product A. The
unit cost of Product A is known to be $40 and the demand curve is
known to be 𝑦 = 800 − 5𝑥.
   • 𝑥: selling price per unit of Product A
   • 𝑦: quarterly demand for Product A
Thus,
• Known input parameters: 40 (unit cost), -5 (marginal effect of price
   on demand), 800 (maximum demand)
• A set of decisions – things that the business can control: 𝑥
• Some constraints on the decision: 𝑥 ≥ 40, so that profit 𝑧 ≥ 0
• An objective or criteria: maximize quarterly profit 𝑧 = 𝑥 − 40 𝑦
-->
</section>

EDITABLE TEXT TRANSCRIPTION:
Example: Investment Decisions
Is this a good investment or a “lemon”? Let’s look at net present value
