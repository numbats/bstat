Multiple Linear Regression (MLR)

24
Test for the Significance of the Overall Multiple Regression Model
• If H0 is rejected,
this means that the explanatory variables as a group provides at least some
power to explain the variation in the response variable Y.
• If H0 is not rejected
this means that this set of explanatory variables has no power to explain the
variation in the response variable Y.
We use the F-test to test the significance of the overall multiple regression
model. The F-test is a formal procedure for testing whether the explained
variation is large compared to the unexplained variation.
-->
</section>

Correlation NOT Causation
• Unless the data is obtained in a carefully controlled experiment - not the case here -
we can never make definitive statements about causation in regression analysis.
• The reason for this is that we can almost never rule out the possibility that some
other variable is causing the variation in both of the observed variables.
Example:
• Obtain the data on all the fires in Melbourne for the last ten years.
• The number of fire fighters at a fire correlates highly with the
corresponding damage in dollars.
• Can we conclude that fire fighters cause the damage???
No, of course not! Both variables result from and are correlated
with the overall size of the fire.
