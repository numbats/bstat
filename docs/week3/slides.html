The Basics of Sampling Distribution
Sample statistic is only an estimate of the truth
Since the sample may vary, any sample statistic is not exact and has variation/error around them. The smaller the error, the greater the accuracy.
Assume we take data samples repeatedly, and compute sample means as the statistic for each set of sample. Then we would have the sampling distribution of the sample mean to portray its variability
A sampling distribution is the probability distribution of a sample statistic.
(eg: Xbar has a sampling distribution and p also has a sampling distribution)
.
-->
</section>

Sampling Distribution of the Sample Mean
The sampling distribution of the sample mean is a statistical tool that helps quantify the uncertainty of the estimate 𝒙  for a given data set.
𝑋 ~ 𝑁(𝜇, 𝜎2𝑛) refers to the sampling distribution of the sample mean.
It shows how the sample mean (𝒙 ) varies from sample to sample
Helps us understand the properties of the sample mean as an estimator of the population mean.
If 𝑋~ 𝑁(𝜇, 𝜎2), then 𝑋 ~ 𝑁(𝜇, 𝜎2𝑛)
The variation of 𝒙  is measured by the standard error of the mean- SE𝒙.
The standard error is the standard deviation of 𝒙 . It is calculated as follows: 𝑠𝑡𝑎𝑛𝑑𝑎𝑟𝑑 𝑑𝑒𝑣𝑖𝑎𝑡𝑖𝑜𝑛 𝑛
For a large n, 𝑺𝑬𝒙 is lower, 𝒙 is more precise estimate of the true population mean (μ)
-->

A telecommunications company closely monitors its call-centre operations to maintain high service standards. According to company reports, the average call handling time is 6.5 minutes, with a standard deviation of 1.2 minutes.
To verify whether daily performance aligns with expectations, a team leader reviews a random sample of 16 customer calls from the previous shift.
Assuming the company’s claim is accurate and call handling times are normally distributed, the probability that the sample mean of the 16 calls falls between 6.0 and 7.0 minutes is 0.9044.
Is this probability calculation valid given the small sample size (n = 16)?Support your explanation with a discussion of population distribution, sample size, and whether the Central Limit Theorem is required in this case.
Yes the answer is valid.
Although the sample size is only 16, the parent population is normally distributed.
We can assume that the mean of the random sample is also normally distributed.
Therefore, CLT is not required.
In other words, since 𝑋 ~ 𝑁𝜇,𝜎2 𝑡h𝑒𝑛 𝑋 ~ 𝑁𝜇,𝜎2𝑛

There are two types of estimates:
Point Estimate
A single value that estimates a population parameter
Interval Estimate
A range of values within which the population parameter probably lies. This range is known as a confidence interval estimate
Point estimates alone do not show the uncertainty caused by sampling error.
Better approach: give a range of values within which the unknown population parameter is thought likely to lie. We refer to this range of plausible values as a confidence interval
Confidence interval = plausible range of the unknown population mean given some level of confidence, based on our sample
Part 2: Estimation of the true population mean (μ)
-->

    <script>
    // Copy over background colors to new div
    divs = document.querySelectorAll('[data-background-color]');

    Array.from(divs).map(function (x) {
      const color = x.dataset.backgroundColor;

      var new_div = document.createElement('div');
      new_div.setAttribute("class", "background-color-div");
      new_div.style.backgroundColor = color;
      x.appendChild(new_div);
      x.removeAttribute("data-background-color");
    })

    // Remove background colors from backgrounds div
    Array.from(
      document.querySelectorAll("[data-background-hash]")
    ).map(function (x) {
      x.removeAttribute("data-background-hash");
      x.style.backgroundColor = null;
    })
    </script>

    <script>
    // Copy over background images to new div
    divs = document.querySelectorAll('[data-background-image]');

    Array.from(divs).map(function (x) {
      var new_div = document.createElement('div');
      new_div.setAttribute("class", "background-image-div");

      if (x.dataset.backgroundImage != undefined) {
        new_div.style.backgroundImage = "url(" + x.dataset.backgroundImage + ")";
        x.removeAttribute("data-background-image");
      }
      if (x.dataset.backgroundSize != undefined) {
        new_div.style.backgroundSize = x.dataset.backgroundSize;
        x.removeAttribute("data-background-size");
      }
      if (x.dataset.backgroundPosition != undefined) {
        new_div.style.backgroundPosition = x.dataset.backgroundPosition;
        x.removeAttribute("data-background-position");
      }
      if (x.dataset.backgroundRepeat != undefined) {
        new_div.style.backgroundRepeat = x.dataset.backgroundRepeat;
        x.removeAttribute("data-background-repeat");
      }
      if (x.dataset.backgroundOpacity != undefined) {
        new_div.style.backgroundOpacity = x.dataset.backgroundOpacity;
        x.removeAttribute("data-background-opacity");
      }

      x.appendChild(new_div);
    })
    </script>

    <script>
    // Copy over background vidoes

    // Run once when we load
    var video_div = document.querySelectorAll(".backgrounds video");
    var slide_div = document.querySelectorAll("[data-background-video]");

    for (let i = 0; i < video_div.length; i++) {
      video_div[i].setAttribute("class", "background-video-div");

      slide_div[i].appendChild(video_div[i]);
      slide_div[i].removeAttribute("data-background-video");
    }

    Reveal.getCurrentSlide().querySelectorAll("video").forEach(x => x.play());

    // Each time we advance slides, as the background videos aren't loaded
    // unless they are a few slides away
    Reveal.on('slidechanged', event => {
      var video_div = document.querySelectorAll(".backgrounds video");
      var slide_div = document.querySelectorAll("[data-background-video]");

      for (let i = 0; i < video_div.length; i++) {
        video_div[i].setAttribute("class", "background-video-div");

        slide_div[i].appendChild(video_div[i]);
        slide_div[i].removeAttribute("data-background-video");
      }

      Reveal.getCurrentSlide().querySelectorAll("video").forEach(x => x.play());
    });
    </script>

        // Esc closes the popup (WCAG 1.4.13) and focus leaving both trigger and

        const hideOnEscAndFocusOut = {
          name: 'hideOnEscAndFocusOut',
          defaultValue: true,
          fn(instance) {
            const dismiss = () => {
              // A show scheduled by the trigger delay would otherwise reopen it
              instance.clearDelayTimeouts();
              instance.hide();

            const onKeyDown = (event) => {
              if (event.key !== 'Escape') {
