Question 1_solution
The sales manager of a clothing company reports that the mean spending by
customers is less than $80. A sample of 50 customers has a mean spending of
$76.25 and a standard deviation of $15.25. We wish to perform an
appropriate hypothesis test at the 5% level of significance. (Note: Include all
steps to get full marks.)
a) State the hypotheses
H0: µ = 80
H1: µ < 80
b) What is the p-value?
Test statistic =        = -1.739
P-value = P(t<-1.739) = T.DIST(-1.739,49,TRUE) =0.044176
-->

<!--
SOURCE: Workshop8_solutions.pdf, page 13.
TEXT SOURCE: PDF text layer.
EDITABLE TEXT TRANSCRIPTION:
Question 1_solution
c) Interpret the results in the context of the question.
We reject the null as the p-value is less than 0.05. There is sufficient evidence at
the 5% level of significance that the true mean spending is less than $80.
d) Is there evidence to support the manager’s claim?
Yes, as per our result in part c, there is evidence to support the manager’s claim.
e) What is a potential error in the test above? Interpret the error in the context
of the question.
Type 1 error where H0 is true and we reject it.
We conclude that the true mean spending is less than $80 when it actually is not.
-->
</section>

    <script>
    // Copy over background images to new div

      var new_div = document.createElement('div');

          button.classList.add('code-copy-button-checked');
          var currentTitle = button.getAttribute("title");
          button.setAttribute("title", "Copied!");
          let tooltip;
          if (window.bootstrap) {
            button.setAttribute("data-bs-toggle", "tooltip");
            button.setAttribute("data-bs-placement", "left");
            button.setAttribute("data-bs-title", "Copied!");
            tooltip = new bootstrap.Tooltip(button, 
              { trigger: "manual", 
                customClass: "code-copy-button-tooltip",
                offset: [0, -8]});
            tooltip.show();    
          }
          setTimeout(function() {
            if (tooltip) {
              tooltip.hide();
              button.removeAttribute("data-bs-title");
              button.removeAttribute("data-bs-toggle");
              button.removeAttribute("data-bs-placement");

            button.setAttribute("title", currentTitle);

        // Esc closes the popup (WCAG 1.4.13) and focus leaving both trigger and
        // popup closes it (WCAG 2.4.11); tippy handles neither for interactive popups.
        const hideOnEscAndFocusOut = {
          name: 'hideOnEscAndFocusOut',
          defaultValue: true,
          fn(instance) {
            const dismiss = () => {
              // A show scheduled by the trigger delay would otherwise reopen it
              instance.clearDelayTimeouts();
              instance.hide();
            };
            const onKeyDown = (event) => {
              if (event.key !== 'Escape') {
                return;
              }
              // Keep Esc from also reaching page handlers (e.g. reveal.js overview),
              // except an open reveal.js slide menu, which Esc should close too.
              // The menu handles keys only when its keyboard option is on.
              const menuHandlesEsc = window.Reveal?.getPlugin?.('menu')?.isOpen() &&
                window.Reveal.getConfig().menu?.keyboard !== false;
              if (!menuHandlesEsc) {
                event.stopPropagation();
              }
              if (instance.popper.contains(window.document.activeElement)) {
                // Disabled while refocusing so the focus trigger does not reopen it
                instance.disable();
                instance.reference.focus();
                instance.enable();
              }
              dismiss();
            };
            const onFocusOut = (event) => {
              const target = event.relatedTarget;
              if (target && !instance.reference.contains(target) &&
                  !instance.popper.contains(target)) {
                dismiss();
              }
            };
            // On the trigger too: a click trigger (code-annotations: select) has no
            // blur handling. Attached for the instance's lifetime so leaving the
            // trigger also cancels a show still pending on the trigger delay.
            instance.reference.addEventListener('focusout', onFocusOut);
            return {
              onShow() {
                window.document.addEventListener('keydown', onKeyDown, true);
                instance.popper.addEventListener('focusout', onFocusOut);
              },
              onHide() {
                window.document.removeEventListener('keydown', onKeyDown, true);
                instance.popper.removeEventListener('focusout', onFocusOut);
              },
              onDestroy() {
                instance.reference.removeEventListener('focusout', onFocusOut);

            };
