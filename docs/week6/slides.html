Overview of Regression: Terminology
Regression analysis is a study of relationships between
variables We use sample data to develop a model of the
relationship, which we can use to make predictions of
the value of a numerical variable based on the value of
one or more variables.
Some terminology:
• Dependent variable: the variable we wish to predict
• Independent variable: the variables used to make the
prediction
-->
</section>

Correlation is a measure of the relative strength of the linear
relationship between two variables, taking values between -1 and 1.
Usually, we will not see perfect negative linear correlation (-1) or
perfect positive linear correlation (+1).
• Strength:
• If correlation is close to -1 or +1, it’s a relatively strong
correlation.
• If correlation is close to 0, it is relatively weak correlation.
• Otherwise, it is relatively moderate.

What is the coefficient of determination?
explainable unexplained
The coefficient of determination is the portion of the total variation
in the dependent variable (Y) that is explained by the linear
relationship with the independent variable (X).
R2 is a measure of ‘Goodness of Fit’, often expressed in %. If we have a
good model, the unexplained component is small.
0≤ R2 ≤1
R2 = 0 (or 0%) means no linear relationship between X and Y
R2 = 1 (or 100%) means deterministic linear relationship between X
and Y

        const hideOnEscAndFocusOut = {
          name: 'hideOnEscAndFocusOut',
          defaultValue: true,
          fn(instance) {
            const dismiss = () => {
              // A show scheduled by the trigger delay would otherwise reopen it
              instance.clearDelayTimeouts();
              instance.hide();
            };

                instance.disable();
                instance.reference.focus();
                instance.enable();

              dismiss();

            const onFocusOut = (event) => {
