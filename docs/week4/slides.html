Step 1:

What we actually observe in the datavs

<!--
SOURCE: Workshop_slides_Week_4_with_solutions.pdf, page 10. Companion PowerPoint slide 10.
TEXT SOURCE: Companion PowerPoint.
COMPONENT IMAGES: figures/etx5900/components/image14.png
EDITABLE TEXT TRANSCRIPTION:
Step 2: Test Statistic
The test statistic is calculated as: 𝜒2= (𝑓𝑜−𝑓𝑒)2𝑓𝑒
Where 𝑓𝑜 = observed frequencies (or count, obtained from the contingency table)
𝑓𝑒= expected frequencies assuming H0 is true   (𝑓𝑒 Row Total x Column TotalOverall Total)
Notes to remember:
This test statistic has an approximate chi-square distribution with df= (r-1)(c-1)
The results are not reliable if the expected frequencies are less than 5.
In this statistical test, we determine whether observed frequencies are significantly different from expected frequencies. If there is a significant difference, we reject the null hypothesis and conclude that the sample data provides sufficient evidence to support the alternative hypothesis.
5 Steps
-->
</section>

Task 2: Convertibles
b. Point out why the formula for the χ2 value allows the test statistic and p-value to be different in the two cases even though all the observed and expected frequencies are proportional.
The formula for the test statistic χ2 has a square of frequencies in the numerator and just a frequency in the denominator.
So, if you double all the frequencies, you will double χ2.
Building on this idea:
Doubling all observed and expected frequencies results in the numerator increasing by a factor of four (because of the square) and the denominator increasing by a factor of two.
As a result, the overall χ² value doubles. This explains why the test statistic is different, even though the tables are proportional.
-->

          const citeInfo = findCites(ref);
          if (citeInfo) {
            tippyHover(citeInfo.el, function() {
              var popup = window.document.createElement('div');
              citeInfo.cites.forEach(function(cite) {
                var citeDiv = window.document.createElement('div');
                citeDiv.classList.add('hanging-indent');
                citeDiv.classList.add('csl-entry');
                var biblioDiv = window.document.getElementById('ref-' + cite);
                if (biblioDiv) {
                  citeDiv.innerHTML = biblioDiv.innerHTML;
                }
                popup.appendChild(citeDiv);
              });
              return popup.innerHTML;
            });
          }
        }
      });
      </script>
