Hypothesis Testing – Classic Example
An hypothesis test is conducted to decide between two
hypotheses: the null H0 and the alternative, H1.
H0: Defendant is not guilty       (‘status quo’; default)
H1: Defendant is guilty (experimental/research hypothesis)
Reject H0: GUILTY!
There IS enough evidence against H0 - the defendant is guilty.
Do not reject H0: NOT GUILTY                         (INNOCENT!)
There IS NOT enough evidence against H0 - the defendant is not guilty.

5 Step Process in Hypothesis Testing
Step 1: Set up the null and the alternative hypotheses based on a benchmark

Test for a proportion (π0) when the data are yes/no or category outcomes.
H0: A default statement/status quo

H1: A belief/claim that we aim to test
(what we are searching evidence for, does not contain the equals sign: ≠, >, <)

EDITABLE TEXT TRANSCRIPTION:
Mechanics of Hypothesis Testing: p-value
Judging whether or not the test statistic is outstandingly “far from zero” in the
direction of the alternative.
It is the probability of getting the test statistic assuming that H0 is true.
p-value = P(Test statistic |H0 is true)
If the p-value is small, then the test statistic is far from zero.
(In the direction of the alternative hypothesis.)
A smaller p-value means that there is stronger evidence in favor of the alternative
hypothesis.
9
-->

EDITABLE TEXT TRANSCRIPTION:
Interpreting the p-value
P-value should be interpreted as the level of “evidence” in favour of the null hypothesis,
when compared against the ALTERNATIVE hypothesis.
A small p-value:
Indicates little evidence in support of the H0;
we have reason to reject H0 in favour of H1
A large p-value:
Indicates considerable evidence in support of the H0;
we do not have reason to reject H0 in favour of H1.
Advantage:
An advantage of p-values is that we can perform hypothesis tests at all significance
levels without finding a new critical value.

COMPONENT IMAGES: figures/etx5900/components/image60.png, figures/etx5900/components/image70.png, figures/etx5900/components/image80.png, figures/etx5900/components/image100.png, figures/etx5900/components/image110.png, figures/etx5900/components/image120.png
EDITABLE TEXT TRANSCRIPTION:
Reject H0 when p-value < α
If p-value < α, reject H0
→ We still can tolerate the potential error and conclude that the p-value is small so we
reject the H0.
→ The smaller the p-value, the more evidence there is in favour of H 1
∴ There is evidence to support the alternative hypothesis.
If p-value > α, fail to reject H0
→ We no longer can tolerate the potential error as it is bigger than the tolerance level
allowed, α. We conclude that the p-value is large so we fail to reject the H0.
→ The larger the p-value, the less evidence there is in favour of H1
∴ There is not enough evidence to support the alternative hypothesis.
Notice: our final conclusion is about the alternative hypothesis!
12
-->
</section>

EDITABLE TEXT TRANSCRIPTION:
Type I and II errors
Since the conclusions that we draw are based on sample data - using a decision rule, there is the
chance of making two possible errors:
Type I Error:
Reject H0 when it’s actually true.
Conclude guilty, when defendant is innocent.
• The probability of a Type I error is denoted by α.
• This value is also referred to as the “Level of Significance”.
Type II Error:
Do not reject H0 when it’s actually false.
Conclude not guilty, when defendant is guilty.
● The probability of making a Type II error is denoted by β.
● (1- β) is referred to as the “Power of the Test”.
NOTE:
If we retain the null, we do not say it is true. We do not say we “accept” it; we simply do not reject it.

              if (!link.classList.contains('no-external-icon')) {
              }
            }
          }
          };
          window.quartoDecorateExternalLinks(window.document);
        // Esc closes the popup (WCAG 1.4.13) and focus leaving both trigger and
        // popup closes it (WCAG 2.4.11); tippy handles neither for interactive popups.
        const hideOnEscAndFocusOut = {
          name: 'hideOnEscAndFocusOut',
          defaultValue: true,
          fn(instance) {
            const dismiss = () => {
              // A show scheduled by the trigger delay would otherwise reopen it
              instance.clearDelayTimeouts();
              instance.hide();
            };
            const onKeyDown = (event) => {
              if (event.key !== 'Escape') {
                return;
              }
              // Keep Esc from also reaching page handlers (e.g. reveal.js overview),
              // except an open reveal.js slide menu, which Esc should close too.
              // The menu handles keys only when its keyboard option is on.
              const menuHandlesEsc = window.Reveal?.getPlugin?.('menu')?.isOpen() &&
                window.Reveal.getConfig().menu?.keyboard !== false;
              if (!menuHandlesEsc) {
                event.stopPropagation();
              }
              if (instance.popper.contains(window.document.activeElement)) {
                // Disabled while refocusing so the focus trigger does not reopen it
                instance.disable();
                instance.reference.focus();
                instance.enable();
              }
              dismiss();
            };
            const onFocusOut = (event) => {
              const target = event.relatedTarget;
              if (target && !instance.reference.contains(target) &&
                  !instance.popper.contains(target)) {
                dismiss();
              }
            };
            // On the trigger too: a click trigger (code-annotations: select) has no
            // blur handling. Attached for the instance's lifetime so leaving the
            // trigger also cancels a show still pending on the trigger delay.
            instance.reference.addEventListener('focusout', onFocusOut);
            return {
              onShow() {
                window.document.addEventListener('keydown', onKeyDown, true);
                instance.popper.addEventListener('focusout', onFocusOut);
              },
              onHide() {
                window.document.removeEventListener('keydown', onKeyDown, true);
                instance.popper.removeEventListener('focusout', onFocusOut);
              },
              onDestroy() {
                instance.reference.removeEventListener('focusout', onFocusOut);
              },
            };
          },
        };
        function tippyHover(el, contentFn, onTriggerFn, onUntriggerFn) {
          const config = {
            allowHTML: true,
            maxWidth: 500,
            delay: 100,
            arrow: false,
            appendTo: function(el) {
                return el.closest('section.slide') || el.parentElement;
            },
            interactive: true,
            interactiveBorder: 10,
            theme: 'light-border',
            placement: 'bottom-start',
            plugins: [hideOnEscAndFocusOut],
          };
          if (contentFn) {
            config.content = contentFn;
          }
          if (onTriggerFn) {
            config.onTrigger = onTriggerFn;
          }
          if (onUntriggerFn) {
            config.onUntrigger = onUntriggerFn;
          }
            config['offset'] = [0,0];
            config['maxWidth'] = 700;
          window.tippy(el, config); 
        }
        const noterefs = window.document.querySelectorAll('a[role="doc-noteref"]');
        for (var i=0; i<noterefs.length; i++) {
          const ref = noterefs[i];
          tippyHover(ref, function() {
            // use id or data attribute instead here
            let href = ref.getAttribute('data-footnote-href') || ref.getAttribute('href');
            try { href = new URL(href).hash; } catch {}
            const id = href.replace(/^#\/?/, "");
            const note = window.document.getElementById(id);
            if (note) {
              return note.innerHTML;
            } else {
              return "";
            }
          });
        }
        const findCites = (el) => {
          const parentEl = el.parentElement;
          if (parentEl) {
            const cites = parentEl.dataset.cites;
            if (cites) {
              return {
                el,
                cites: cites.split(' ')
              };
            } else {
              return findCites(el.parentElement)
            }
          } else {
            return undefined;
          }
        };
        var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
        for (var i=0; i<bibliorefs.length; i++) {
          const ref = bibliorefs[i];
          const citeInfo = findCites(ref);
          if (citeInfo) {
            tippyHover(citeInfo.el, function() {
              var popup = window.document.createElement('div');
              citeInfo.cites.forEach(function(cite) {
                var citeDiv = window.document.createElement('div');
                citeDiv.classList.add('hanging-indent');
                citeDiv.classList.add('csl-entry');
                var biblioDiv = window.document.getElementById('ref-' + cite);
                if (biblioDiv) {
                  citeDiv.innerHTML = biblioDiv.innerHTML;
                }
                popup.appendChild(citeDiv);
              });
              return popup.innerHTML;
            });
          }
        }
      });
