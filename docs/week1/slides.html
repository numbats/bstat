Variance and Standard Deviation
Variance: Mean of the squared deviations from the mean
Population variance: 𝝈𝟐
Sample variance: 𝒔𝟐 (Best estimate of population variance)
• Disadvantage: Hard to interpret (the units are squared!)
Standard Deviation: Defined as the square root of variance ( 𝑉𝑎𝑟 )
Population standard deviation: 𝝈
Sample standard deviation: 𝒔 (Best estimate of population std dev)
• Advantage: Easier to interpret as units are the same as the original data
14
-->
</section>

Otis Elevator Company
Mean and median: 1 inch for both suppliers
Variance: Supplier 2 > Supplier 1 (0.001200 > 0.000133)
• Supplier 1 preferred: less variation around the mean.
• However, variances are difficult to interpret because their units are inches squared, not inches.
Standard deviation: Supplier 2 > Supplier 1 (0.0346 > 0.0115)
• Supplier 1’s standard deviation is about 1/3 of Supplier 2’s standard deviation. Quite a disparity!
Given that Otis wants 1-inch diameter rails, Supplier 1 is preferred.

Shape of Distributions
Skewness measures how symmetric the distribution is
• Positive statistic → positive skewed, right tail longer than the left tail
• Negative statistic → negative skewed, left tail longer than the right tail
Left-Skewed                       Symmetric                            Right-Skewed
(Skewness < 0)                   (Skewness = 0)                        (Skewness > 0)
Mean < Median                    Mean = Median                       Mean > Median
Some very “low” values           An equal number of “low” &            Some very “high” values
The mean is pulled left toward     “high” values. The mean stays      The mean is pulled right toward
the “tail” of the distribution    in the centre of the distribution     the “tail” of the distribution
